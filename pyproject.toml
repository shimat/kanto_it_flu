[project]
name = "kanto-it-flu"
version = "0.2.0"
description = "Streamlitによる、東振協インフルエンザ予防接種 会場リスト"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "folium>=0.20,<1",
    "pandas>=3.0,<4",
    "pyproj>=3.8,<4",
    "requests>=2.32,<3",
    "streamlit>=1.63,<2",
    "streamlit-folium>=0.27,<1",
    "streamlit-geolocation>=0.0.10,<1",
    "xlrd>=2.0.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "css.py",
    "tools/address_to_latlon.py",
    "tools/*_sample.py",
]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "COM812",
    "CPY001",
    "D",
    "ERA001",
    "INP001",
    "ISC001",
    "PD002",
    "PLR2004",
    "RUF001",
    "S101",
    "T201",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
