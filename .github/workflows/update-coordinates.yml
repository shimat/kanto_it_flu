name: Update coordinates

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of new addresses to geocode (0 means all)"
        required: false
        default: "0"

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.12.1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Geocode new and changed addresses
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: >-
          uv run --locked python -m tools.update_coordinates
          --write
          --limit "${{ inputs.limit }}"
          --output address_coordinates.next.csv
      - uses: actions/upload-artifact@v7
        with:
          name: address-coordinates
          path: address_coordinates.next.csv
          retention-days: 14
